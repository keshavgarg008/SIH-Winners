<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureStay - Gov ID Registration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* Mobile Container */
        .app-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        @media (min-width: 450px) {
            .app-container { height: 85vh; border-radius: 24px; border: 8px solid #0f172a; }
        }

        .header { padding: 24px 20px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        .header-title { font-size: 20px; font-weight: 700; color: #0f172a; }

        .content { padding: 30px 20px; flex: 1; }
        
        .form-group { margin-bottom: 24px; }
        .label { display: block; font-size: 14px; font-weight: 600; color: #475569; margin-bottom: 8px; }
        
        .input-field {
            width: 100%; padding: 16px; font-size: 16px;
            border: 2px solid #e2e8f0; border-radius: 12px;
            outline: none; transition: border-color 0.2s;
            letter-spacing: 2px;
        }
        .input-field:focus { border-color: #3b82f6; }

        .btn-primary {
            width: 100%; padding: 16px; background-color: #2563eb;
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: background 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-primary:disabled { background-color: #94a3b8; cursor: not-allowed; }

        .security-note {
            margin-top: 24px; padding: 16px; background-color: #f0fdf4;
            border: 1px solid #bbf7d0; border-radius: 12px;
            font-size: 13px; color: #166534; display: flex; gap: 12px;
        }

        #status-box {
            margin-top: 20px; text-align: center; font-size: 14px; font-weight: 600; color: #3b82f6;
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3); border-radius: 50%;
            border-top: 3px solid white; width: 20px; height: 20px;
            animation: spin 1s linear infinite; display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <div class="header-title">Identity Setup</div>
        </header>

        <div class="content">
            <div class="form-group">
                <label class="label">Enter Government ID Number</label>
                <!-- Type is tel to bring up number pad on mobile -->
                <input type="tel" id="govIdInput" class="input-field" placeholder="XXXX XXXX XXXX" maxlength="14" autocomplete="off">
            </div>

            <button id="verifyBtn" class="btn-primary" onclick="processRegistration()">
                <div class="spinner" id="spinner"></div>
                <span id="btnText">Fetch & Secure via Gov Portal</span>
            </button>

            <div id="status-box"></div>

            <div class="security-note">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <p><strong>Zero-Knowledge Architecture:</strong> Your raw ID number is mathematically hashed locally on your device. We never transmit or store the actual digits in our database.</p>
            </div>
        </div>
    </div>

    <script>
        // Formats the input with spaces for readability (XXXX XXXX XXXX)
        document.getElementById('govIdInput').addEventListener('input', function (e) {
            let target = e.target;
            let val = target.value.replace(/\D/g, '').substring(0, 12);
            target.value = val != '' ? val.match(/.{1,4}/g).join(' ') : '';
        });

        async function processRegistration() {
            const rawInput = document.getElementById('govIdInput').value.replace(/\s/g, '');
            const btn = document.getElementById('verifyBtn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btnText');
            const statusBox = document.getElementById('status-box');

            if (rawInput.length !== 12) {
                alert("Please enter a valid 12-digit ID number.");
                return;
            }

            // UI Loading State
            btn.disabled = true;
            spinner.style.display = 'block';
            btnText.innerText = 'Connecting to Gov API...';
            statusBox.innerText = 'Authenticating with DigiLocker Sandbox...';

            try {
                // STEP 1: Hash the ID on the client side (Crucial for Privacy)
                // This converts the ID into an irreversible string of characters
                const encoder = new TextEncoder();
                const data = encoder.encode(rawInput);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashedId = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                
                const lastFour = rawInput.slice(-4);

                // STEP 2: Simulate fetching verified data from Gov Portal
                setTimeout(() => {
                    statusBox.innerText = 'Data retrieved. Securing and uploading to Firebase...';
                    
                    // The data we hypothetically received from the Gov API
                    const verifiedGovData = {
                        fullName: "John Sharma",
                        dob: "1995-08-15",
                        photoReference: "base64_string_of_face_photo", // This will be used by the kiosk later
                        isVerified: true
                    };

                    // STEP 3: Create the Firebase payload using only safe data
                    const firebasePayload = {
                        idHash: hashedId,
                        displayId: `[Redacted] - Last 4: ${lastFour}`,
                        name: verifiedGovData.fullName,
                        photoData: verifiedGovData.photoReference,
                        timestamp: new Date().toISOString()
                    };

                    console.log("✅ Ready for Firestore upload:", firebasePayload);
                    // Actual Firebase Code would go here:
                    // await setDoc(doc(db, "government_citizens", hashedId), firebasePayload);

                    // STEP 4: Success state
                    setTimeout(() => {
                        spinner.style.display = 'none';
                        btnText.innerText = 'Identity Secured';
                        btn.style.backgroundColor = '#166534';
                        statusBox.style.color = '#166534';
                        statusBox.innerText = 'Registration Complete! Loading Wallet...';
                        
                        // Redirect to the Wallet screen built in Step 2
                        // window.location.href = 'wallet.html';
                    }, 1500);

                }, 1500);

            } catch (error) {
                console.error("Hashing failed:", error);
                statusBox.innerText = 'Security error occurred.';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
